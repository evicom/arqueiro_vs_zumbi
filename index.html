<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Arqueiro vs Zumbis</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#0b0f1a; color:#fff;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      touch-action: none;
    }

    #rotate-screen {
      display:none;
      position:fixed; inset:0; z-index:9999;
      background:#0b0f1a;
      flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:20px;
    }
    #rotate-screen .phone {
      width:80px; height:140px; border:4px solid #fff; border-radius:14px;
      margin-bottom:20px; animation: rotar 2s ease-in-out infinite;
    }
    @keyframes rotar {
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(-90deg); }
    }
    @media screen and (orientation: portrait) {
      #rotate-screen { display:flex !important; }
      #game-container { display:none !important; }
    }

    #game-container {
      position:relative; width:100vw; height:100vh;
      background: linear-gradient(180deg, #0a0e1a 0%, #1a2332 30%, #2d3e50 60%, #3d5a3d 85%, #2d4a2d 100%);
      overflow:hidden;
    }

    #stars, #stars2, #stars3 {
      position:absolute; top:0; left:0; width:100%; height:60%;
      pointer-events:none; z-index:1;
    }

    #moon {
      position:absolute; top:5%; right:8%;
      width:80px; height:80px; border-radius:50%;
      background: radial-gradient(circle at 30% 30%, #fffef0 0%, #f5f0d0 40%, #d4c890 100%);
      box-shadow: 0 0 60px rgba(245,240,208,.6);
      z-index:1;
    }

    #hud {
      position:absolute; top:10px; left:10px; right:10px;
      display:flex; justify-content:space-between; align-items:center;
      font-size:15px; font-weight:bold;
      background:rgba(0,0,0,.6); padding:12px 18px; border-radius:12px;
      z-index:10; border:1px solid rgba(255,255,255,.1);
    }
    #hud div span { color:#ffd54a; }

    #power-container {
      position:absolute;
      left: 180px;
      bottom: 100px;
      width: 40px;
      height: 200px;
      background: rgba(0,0,0,.6);
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 8px;
      z-index: 15;
      overflow: hidden;
      display: none;
    }
    #power-bar {
      position:absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0%;
      background: linear-gradient(180deg, #00ff00 0%, #ffff00 50%, #ff0000 100%);
      transition: height 0.05s;
    }
    #power-label {
      position:absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }

    #sound-control {
      position:absolute; top:10px; right:10px;
      width:42px; height:42px; border-radius:50%;
      background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.2);
      color:#fff; font-size:20px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; z-index:15;
    }

    #arena {
      position:absolute; inset:0; top:60px; bottom:110px;
      overflow:hidden; cursor: crosshair; z-index:5;
    }

    #ground {
      position:absolute; bottom:0; left:0; right:0; height:100px;
      background: linear-gradient(180deg, #4a6b4a 0%, #3d5a3d 30%, #2d4a2d 70%, #1a3018 100%);
      border-top: 4px solid #2d4a2d;
      z-index:2;
    }

    .character {
      position:absolute;
      pointer-events:none;
      z-index:6;
      will-change: transform;
    }

    #aim-line {
      position:absolute;
      pointer-events:none;
      border-top: 3px dashed rgba(255,255,255,.8);
      transform-origin: left center;
      z-index:9;
      display:none;
    }

    .arrow {
      position:absolute;
      width:50px; height:8px;
      pointer-events:none;
      z-index:7;
      will-change: transform;
    }
    .arrow .shaft {
      position:absolute; left:0; top:3px;
      width:42px; height:2px;
      background: linear-gradient(90deg, #5a3a1a, #d4a574);
    }
    .arrow .head {
      position:absolute; right:0; top:-3px;
      width:0; height:0;
      border-left:12px solid #c0c0c0;
      border-top:7px solid transparent;
      border-bottom:7px solid transparent;
    }
    .arrow.explosive .shaft { background: linear-gradient(90deg, #8b0000, #ff4500); }
    .arrow.explosive .head  { border-left-color:#ff4500; }
    .arrow.triple .shaft    { background: linear-gradient(90deg, #1e3a8a, #60a5fa); }
    .arrow.triple .head     { border-left-color:#60a5fa; }

    .explosion {
      position:absolute; width:120px; height:120px; border-radius:50%;
      background: radial-gradient(circle, #ffffff 0%, #ffff00 20%, #ff8c00 50%, #ff4500 75%, transparent 100%);
      animation: boom .6s ease-out forwards;
      pointer-events:none; z-index:8;
    }
    @keyframes boom {
      0%   { transform:scale(0); opacity:1; }
      100% { transform:scale(2.5); opacity:0; }
    }

    .damage {
      position:absolute; color:#ff4444; font-weight:bold; font-size:24px;
      pointer-events:none; animation:floatUp 1s ease-out forwards; z-index:10;
      text-shadow: 2px 2px 4px #000;
    }
    @keyframes floatUp {
      0%   { transform:translateY(0); opacity:1; }
      100% { transform:translateY(-60px); opacity:0; }
    }

    #arrow-buttons {
      position:absolute; bottom:10px; left:50%;
      transform:translateX(-50%); display:flex; gap:12px;
      z-index:20; padding:8px 12px;
      background:rgba(0,0,0,.7); border-radius:16px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .arrow-btn {
      width:70px; height:70px; border-radius:14px;
      border:2px solid rgba(255,255,255,.2);
      background:linear-gradient(180deg, #3a4a6a, #2a3a50);
      color:#fff; font-size:12px; font-weight:bold;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:3px; cursor:pointer;
    }
    .arrow-btn:active { transform:scale(.95); }
    .arrow-btn.active {
      border-color:#ffd54a;
      box-shadow:0 0 20px rgba(255,213,74,.6);
    }
    .arrow-btn .icon { font-size:26px; }
    .arrow-btn .label { font-size:11px; }

    .screen {
      position:absolute; inset:0; 
      background:rgba(0,0,0,.9);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:50; text-align:center; padding:20px;
    }
    .screen h1 {
      font-size:clamp(28px,6vw,56px); color:#ffd54a; margin-bottom:15px;
      text-shadow:0 0 30px rgba(255,213,74,.8);
    }
    .screen p { font-size:clamp(15px,2.5vw,20px); margin-bottom:25px; opacity:.95; line-height: 1.6; }
    .btn {
      padding:18px 42px; font-size:20px; font-weight:bold;
      background:linear-gradient(180deg, #ffd54a, #e6a800);
      color:#1a1a1a; border:none; border-radius:14px;
      cursor:pointer; box-shadow:0 6px 0 #8b6914;
      transition: all 0.2s;
    }
    .btn:hover { transform:translateY(-3px); }
    .btn:active { transform:translateY(3px); box-shadow:0 3px 0 #8b6914; }
    .hidden { display:none !important; }

    #instructions {
      position:absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      color: #ffd54a;
      z-index: 12;
      animation: fadeInOut 3s ease-in-out;
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="rotate-screen">
    <div class="phone"></div>
    <h2>Gire o dispositivo</h2>
    <p>Modo paisagem recomendado</p>
  </div>

  <div id="game-container">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
    <div id="moon"></div>

    <div id="hud">
      <div>Fase: <span id="phase">1</span>/50</div>
      <div style="color: #fff;"> Flechas: ∞</div>
      <div>Inimigos: <span id="enemies">0</span></div>
    </div>

    <div id="sound-control">🔊</div>

    <div id="power-container">
      <div id="power-bar"></div>
      <div id="power-label">FORÇA</div>
    </div>

    <div id="instructions">
      Segure e arraste para carregar força → Solte para atirar!
    </div>

    <div id="arena">
      <div id="ground"></div>
      <div id="aim-line"></div>

      <!-- CAVALO + ARQUEIRO MELHORADO -->
      <svg id="archer" class="character" width="200" height="180" viewBox="0 0 200 180" style="left:80px; bottom:100px;">
        <!-- Sombra -->
        <ellipse cx="100" cy="175" rx="80" ry="10" fill="rgba(0,0,0,.3)"/>
        
        <!-- CAVALO -->
        <g id="horse">
          <!-- Corpo -->
          <ellipse cx="100" cy="100" rx="60" ry="38" fill="#8B4513"/>
          <ellipse cx="100" cy="95" rx="55" ry="33" fill="#A0522D" opacity="0.7"/>
          
          <!-- Pescoço -->
          <path d="M 140 85 Q 160 70 165 50 Q 167 40 160 38 Q 155 36 153 45 Q 150 60 135 75" 
                fill="#8B4513"/>
          
          <!-- Cabeça -->
          <ellipse cx="162" cy="42" rx="20" ry="14" fill="#8B4513"/>
          <ellipse cx="168" cy="40" rx="7" ry="5" fill="#2a1a08"/>
          <circle cx="172" cy="38" r="2.5" fill="#fff" opacity="0.7"/>
          
          <!-- Orelhas -->
          <path d="M 155 32 L 153 22 L 158 30 Z" fill="#8B4513"/>
          <path d="M 162 30 L 163 20 L 165 29 Z" fill="#8B4513"/>
          
          <!-- Crina -->
          <path d="M 158 48 Q 155 40 157 32 Q 159 25 156 20" 
                stroke="#5a2a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M 155 50 Q 152 42 154 34" 
                stroke="#5a2a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          
          <!-- Cauda -->
          <path d="M 45 95 Q 30 100 25 110 Q 23 115 27 118" 
                stroke="#5a2a0a" stroke-width="7" fill="none" stroke-linecap="round"/>
          
          <!-- Pernas -->
          <rect x="60" y="130" width="11" height="42" fill="#8B4513" rx="3"/>
          <rect x="82" y="130" width="11" height="42" fill="#8B4513" rx="3"/>
          <rect x="115" y="130" width="11" height="42" fill="#8B4513" rx="3"/>
          <rect x="137" y="130" width="11" height="42" fill="#8B4513" rx="3"/>
          
          <!-- Cascos -->
          <rect x="59" y="168" width="13" height="7" fill="#2a1a08" rx="2"/>
          <rect x="81" y="168" width="13" height="7" fill="#2a1a08" rx="2"/>
          <rect x="114" y="168" width="13" height="7" fill="#2a1a08" rx="2"/>
          <rect x="136" y="168" width="13" height="7" fill="#2a1a08" rx="2"/>
          
          <!-- Sela -->
          <path d="M 82 85 Q 100 80 118 85 L 118 95 Q 100 100 82 95 Z" 
                fill="#5a3a1a" stroke="#3a2817" stroke-width="2"/>
          <rect x="95" y="88" width="10" height="3" fill="#3a2817"/>
        </g>
        
        <!-- ARQUEIRO -->
        <g id="rider">
          <!-- Pernas -->
          <path d="M 90 95 L 86 112 L 90 117" fill="#5a3a1a"/>
          <path d="M 110 95 L 114 112 L 110 117" fill="#5a3a1a"/>
          
          <!-- Corpo -->
          <path d="M 78 55 L 122 55 L 118 95 L 82 95 Z" fill="#2d5016"/>
          <rect x="80" y="88" width="40" height="6" fill="#3a2817"/>
          <rect x="97" y="88" width="6" height="6" fill="#ffd54a"/>
          
          <!-- Braços -->
          <rect x="68" y="57" width="10" height="28" fill="#f4c28c" rx="4"/>
          <rect x="122" y="57" width="10" height="28" fill="#f4c28c" rx="4"/>
          
          <!-- Cabeça -->
          <circle cx="95" cy="42" r="16" fill="#f4c28c"/>
          
          <!-- Chapéu -->
          <path d="M 78 34 Q 95 16 112 34 L 112 41 L 78 41 Z" fill="#2d5016"/>
          <path d="M 110 22 Q 122 16 128 24 Q 130 27 127 29" stroke="#ff4444" stroke-width="3" fill="none"/>
          <circle cx="128" cy="24" r="3" fill="#ffd54a"/>
          
          <!-- Rosto -->
          <circle cx="90" cy="42" r="2.5" fill="#000"/>
          <circle cx="100" cy="42" r="2.5" fill="#000"/>
          <path d="M 92 50 Q 95 52 98 50" stroke="#000" stroke-width="1.5" fill="none"/>
          
          <!-- Arco -->
          <path d="M 132 50 Q 146 67 132 85" stroke="#6b3410" stroke-width="6" fill="none" stroke-linecap="round"/>
          <line x1="132" y1="50" x2="132" y2="85" stroke="#e8e8e8" stroke-width="2"/>
          <circle cx="132" cy="60" r="2.5" fill="#ffd54a"/>
          <circle cx="132" cy="75" r="2.5" fill="#ffd54a"/>

      </svg>
    </div>

    <div id="arrow-buttons">
      <button class="arrow-btn active" data-type="normal">
        <span class="icon">🏹</span>
        <span class="label">Normal</span>
      </button>
      <button class="arrow-btn" data-type="explosive">
        <span class="icon">💣</span>
        <span class="label">Explosiva</span>
      </button>
      <button class="arrow-btn" data-type="triple">
        <span class="icon">🏹🏹</span>
        <span class="label">Tripla</span>
      </button>
    </div>

    <div id="start-screen" class="screen">
      <h1>🏹 Arqueiro vs Zumbis</h1>
      <p>Enfrente 50 ondas de zumbis!<br>
      <small><strong>Segure e arraste</strong> para carregar força → Solte para atirar</small></p>
      <button class="btn" id="btn-start">Iniciar Batalha</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h1 id="go-title">💀 Derrota</h1>
      <p id="go-text">Os zumbis invadiram...</p>
      <button class="btn" id="btn-retry">Tentar Novamente</button>
    </div>
  </div>

  <script>
    const AudioSys = {
      ctx: null,
      enabled: true,
      musicOscillators: [],
      gainNode: null,
      
      init() {
        if (!this.ctx) {
          try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.gainNode = this.ctx.createGain();
            this.gainNode.connect(this.ctx.destination);
            this.gainNode.gain.value = 0.25;
          } catch(e) {}
        }
      },

      playSuspenseMusic() {
        if (!this.ctx || !this.enabled) return;
        this.stopMusic();
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sine';
        osc1.frequency.value = 55;
        const gain1 = this.ctx.createGain();
        gain1.gain.value = 0.12;
        osc1.connect(gain1);
        gain1.connect(this.gainNode);
        osc1.start(now);
        const osc2 = this.ctx.createOscillator();
        osc2.type = 'triangle';
        osc2.frequency.value = 82.41;
        const gain2 = this.ctx.createGain();
        gain2.gain.value = 0.06;
        osc2.connect(gain2);
        gain2.connect(this.gainNode);
        osc2.start(now);
        this.musicOscillators = [osc1, osc2, gain1, gain2];
      },

      stopMusic() {
        this.musicOscillators.forEach(o => { try { o.stop(); } catch(e) {} });
        this.musicOscillators = [];
      },

      shoot(power) {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const intensity = Math.min(power / 100, 1);
        const osc = this.ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600 + intensity * 400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1 + intensity * 0.1);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.2 + intensity * 0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15 + intensity * 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      },

      explosion() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const duration = 0.6;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      },

      zombieGroan() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const duration = 1 + Math.random() * 0.8;
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        const baseFreq = 50 + Math.random() * 70;
        osc1.frequency.setValueAtTime(baseFreq, now);
        osc1.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + duration);
        const osc2 = this.ctx.createOscillator();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(baseFreq * 1.2, now);
        osc2.frequency.exponentialRampToValueAtTime(baseFreq * 0.6, now + duration);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 600;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.15);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration);
        osc2.stop(now + duration);
      },

      hit() {
        if (!this.ctx || !this.enabled) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.12);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      },

      toggle() {
        this.enabled = !this.enabled;
        if (!this.enabled) this.stopMusic();
        return this.enabled;
      }
    };

    function generateStars() {
      const layers = [
        { el: document.getElementById('stars'),  count: 100, size: 1 },
        { el: document.getElementById('stars2'), count: 60,  size: 2 },
        { el: document.getElementById('stars3'), count: 30,  size: 3 }
      ];
      layers.forEach(layer => {
        let shadows = [];
        for (let i = 0; i < layer.count; i++) {
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          const alpha = 0.4 + Math.random() * 0.6;
          shadows.push(`${x}vw ${y}vh 0 ${layer.size}px rgba(255,255,255,${alpha})`);
        }
        layer.el.style.boxShadow = shadows.join(',');
        layer.el.style.width = '1px';
        layer.el.style.height = '1px';
      });
    }
    generateStars();

    const state = {
      phase: 1,
      enemiesAlive: 0,
      currentType: 'normal',
      running: false,
      zombies: [],
      arrowsFlying: [],
      gravity: 0.35,
      groanInterval: null,
      charging: false,
      chargePower: 0,
      chargeDirection: 1,
      chargeInterval: null
    };

    const $ = id => document.getElementById(id);
    const arena = $('arena');
    const archer = $('archer');
    const aimLine = $('aim-line');
    const powerContainer = $('power-container');
    const powerBar = $('power-bar');

    $('sound-control').addEventListener('click', () => {
      const enabled = AudioSys.toggle();
      $('sound-control').textContent = enabled ? '🔊' : '🔇';
    });

    document.querySelectorAll('.arrow-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.arrow-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.currentType = btn.dataset.type;
      });
    });

    function updateHUD() {
      $('phase').textContent = state.phase;
      $('enemies').textContent = state.enemiesAlive;
    }

    function getArcherOrigin() {
      const archerRect = archer.getBoundingClientRect();
      const arenaRect = arena.getBoundingClientRect();
      return {
        x: archerRect.right - arenaRect.left - 15,
        y: archerRect.top - arenaRect.top + archerRect.height * 0.45
      };
    }

    function startCharging(e) {
      if (!state.running) return;
      if (e.target.closest('.arrow-btn') || e.target.closest('#sound-control')) return;
      
      state.charging = true;
      state.chargePower = 0;
      powerContainer.style.display = 'block';
      
      const charge = () => {
        if (!state.charging) return;
        state.chargePower += state.chargeDirection * 2;
        if (state.chargePower >= 100) {
          state.chargePower = 100;
          state.chargeDirection = -1;
        } else if (state.chargePower <= 0) {
          state.chargePower = 0;
          state.chargeDirection = 1;
        }
        powerBar.style.height = state.chargePower + '%';
        if (state.chargePower < 50) {
          powerBar.style.background = 'linear-gradient(180deg, #00ff00, #00cc00)';
        } else if (state.chargePower < 80) {
          powerBar.style.background = 'linear-gradient(180deg, #ffff00, #ffcc00)';
        } else {
          powerBar.style.background = 'linear-gradient(180deg, #ff0000, #cc0000)';
        }
        state.chargeInterval = requestAnimationFrame(charge);
      };
      charge();
    }

    function shoot(e) {
      if (!state.running || !state.charging) return;
      state.charging = false;
      cancelAnimationFrame(state.chargeInterval);
      powerContainer.style.display = 'none';
      
      AudioSys.init();
      AudioSys.shoot(state.chargePower);
      
      const origin = getArcherOrigin();
      const arenaRect = arena.getBoundingClientRect();
      const tx = e.clientX - arenaRect.left;
      const ty = e.clientY - arenaRect.top;
      const dx = tx - origin.x;
      const dy = ty - origin.y;
      const angle = Math.atan2(dy, dx);
      const basePower = 8 + (state.chargePower / 100) * 17;
      
      const type = state.currentType;
      const angles = type === 'triple' ? [angle - 0.2, angle, angle + 0.2] : [angle];

      angles.forEach(ang => {
        const arrow = document.createElement('div');
        arrow.className = 'arrow' + (type === 'explosive' ? ' explosive' : '') + (type === 'triple' ? ' triple' : '');
        arrow.innerHTML = '<div class="shaft"></div><div class="head"></div>';
        arrow.style.left = origin.x + 'px';
        arrow.style.top = origin.y + 'px';
        arena.appendChild(arrow);

        state.arrowsFlying.push({
          el: arrow, x: origin.x, y: origin.y,
          vx: Math.cos(ang) * basePower,
          vy: Math.sin(ang) * basePower,
          type: type
        });
      });

      aimLine.style.display = 'block';
      aimLine.style.left = origin.x + 'px';
      aimLine.style.top = origin.y + 'px';
      aimLine.style.width = Math.min(Math.hypot(dx, dy), 250) + 'px';
      aimLine.style.transform = `rotate(${angle}rad)`;
      setTimeout(() => { aimLine.style.display = 'none'; }, 150);
      
      state.chargePower = 0;
    }

    arena.addEventListener('pointerdown', startCharging, { passive: false });
    arena.addEventListener('pointerup', shoot, { passive: false });
    arena.addEventListener('pointercancel', () => {
      state.charging = false;
      cancelAnimationFrame(state.chargeInterval);
      powerContainer.style.display = 'none';
    });

    function createZombieSVG(isBoss) {
      const w = isBoss ? 90 : 55;
      const h = isBoss ? 140 : 90;
      const s = isBoss ? 1.5 : 1;
      const skin = isBoss ? '#6a6a6a' : '#7fb069';
      const skinDark = isBoss ? '#3a3a3a' : '#4a7c3a';

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'character');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      svg.innerHTML = `
        <rect x="${20*s}" y="${70*s}" width="${8*s}" height="${28*s}" fill="${skinDark}"/>
        <rect x="${32*s}" y="${70*s}" width="${8*s}" height="${28*s}" fill="${skinDark}"/>
        <path d="M ${15*s} ${40*s} L ${45*s} ${40*s} L ${42*s} ${72*s} L ${18*s} ${72*s} Z" fill="${isBoss ? '#2a2a2a' : '#5a3a1a'}"/>
        <rect x="${5*s}" y="${42*s}" width="${7*s}" height="${25*s}" fill="${skin}" rx="3" transform="rotate(-20 ${8*s} ${42*s})"/>
        <rect x="${48*s}" y="${42*s}" width="${7*s}" height="${25*s}" fill="${skin}" rx="3" transform="rotate(20 ${51*s} ${42*s})"/>
        <circle cx="${30*s}" cy="${28*s}" r="${13*s}" fill="${skin}"/>
        <circle cx="${24*s}" cy="${27*s}" r="${2.5*s}" fill="#ff0000"/>
        <circle cx="${36*s}" cy="${27*s}" r="${2.5*s}" fill="#ff0000"/>
        <circle cx="${24*s}" cy="${27*s}" r="${1*s}" fill="#ffff00"/>
        <circle cx="${36*s}" cy="${27*s}" r="${1*s}" fill="#ffff00"/>
        <path d="M ${22*s} ${36*s} L ${38*s} ${36*s} L ${36*s} ${40*s} L ${24*s} ${40*s} Z" fill="#2a0000"/>
        <line x1="${26*s}" y1="${36*s}" x2="${26*s}" y2="${40*s}" stroke="#fff" stroke-width="1"/>
        <line x1="${30*s}" y1="${36*s}" x2="${30*s}" y2="${40*s}" stroke="#fff" stroke-width="1"/>
        <line x1="${34*s}" y1="${36*s}" x2="${34*s}" y2="${40*s}" stroke="#fff" stroke-width="1"/>
        ${isBoss ? `<path d="M ${15*s} ${20*s} Q ${30*s} ${5*s} ${45*s} ${20*s}" fill="#4a4a4a"/>` : ''}
      `;
      return svg;
    }

    function startPhase() {
      state.enemiesAlive = 0;
      updateHUD();

      state.zombies.forEach(z => z.el.remove());
      state.zombies = [];

      const isBoss = state.phase === 50;
      const count = isBoss ? 1 : Math.min(3 + Math.floor(state.phase / 3), 10);

      // Spawn com espaçamento adequado (150-200px entre zumbis)
      for (let i = 0; i < count; i++) {
        setTimeout(() => spawnZombie(isBoss, i * 180), i * 600);
      }

      startZombieGroans();
    }

    function spawnZombie(isBoss, offset = 0) {
      if (!state.running) return;
      const el = createZombieSVG(isBoss);
      const arenaW = arena.clientWidth;
      const arenaH = arena.clientHeight;
      const zw = isBoss ? 90 : 55;
      const zh = isBoss ? 140 : 90;

      el.style.position = 'absolute';
      el.style.left = (arenaW + offset) + 'px';
      el.style.bottom = '100px';
      arena.appendChild(el);

      state.zombies.push({
        el, x: arenaW + offset, y: arenaH - 100 - zh,
        w: zw, h: zh,
        hp: isBoss ? 20 : 1 + Math.floor(state.phase / 8),
        speed: isBoss ? 0.4 : 0.5 + Math.random() * 0.3 + state.phase * 0.015,
        isBoss, hitFlash: 0
      });
      state.enemiesAlive++;
      updateHUD();
    }

    function startZombieGroans() {
      stopZombieGroans();
      const groan = () => {
        if (!state.running || state.zombies.length === 0) return;
        AudioSys.zombieGroan();
        state.groanInterval = setTimeout(groan, 2500 + Math.random() * 3500);
      };
      state.groanInterval = setTimeout(groan, 2000);
    }

    function stopZombieGroans() {
      if (state.groanInterval) {
        clearTimeout(state.groanInterval);
        state.groanInterval = null;
      }
    }

    function loop() {
      if (!state.running) return;

      for (let j = state.zombies.length - 1; j >= 0; j--) {
        const z = state.zombies[j];
        z.x -= z.speed;
        z.el.style.left = z.x + 'px';

        if (z.hitFlash > 0) {
          z.hitFlash--;
          z.el.style.filter = 'brightness(2.5)';
        } else {
          z.el.style.filter = '';
        }

        if (z.x < 250) {
          endGame(false);
          return;
        }
      }

      for (let i = state.arrowsFlying.length - 1; i >= 0; i--) {
        const f = state.arrowsFlying[i];
        f.vy += state.gravity;
        f.x += f.vx;
        f.y += f.vy;

        const angle = Math.atan2(f.vy, f.vx);
        f.el.style.left = (f.x - 25) + 'px';
        f.el.style.top = (f.y - 4) + 'px';
        f.el.style.transform = `rotate(${angle}rad)`;

        const groundY = arena.clientHeight - 100;
        if (f.y >= groundY) {
          if (f.type === 'explosive') explode(f.x, f.y);
          f.el.remove();
          state.arrowsFlying.splice(i, 1);
          continue;
        }

        if (f.x > arena.clientWidth + 50 || f.x < -50 || f.y > arena.clientHeight + 50) {
          f.el.remove();
          state.arrowsFlying.splice(i, 1);
          continue;
        }

        for (let j = state.zombies.length - 1; j >= 0; j--) {
          const z = state.zombies[j];
          if (f.x > z.x && f.x < z.x + z.w && f.y > z.y && f.y < z.y + z.h) {
            const dmg = f.type === 'explosive' ? 3 : 1;
            z.hp -= dmg;
            z.hitFlash = 6;
            showDamage(f.x, f.y, dmg);
            AudioSys.hit();

            if (f.type === 'explosive') {
              explode(f.x, f.y);
              AudioSys.explosion();
              state.zombies.forEach(zz => {
                if (zz !== z && Math.abs(zz.x + zz.w/2 - f.x) < 100) {
                  zz.hp -= 2;
                  zz.hitFlash = 6;
                }
              });
            }

            f.el.remove();
            state.arrowsFlying.splice(i, 1);

            if (z.hp <= 0) {
              z.el.remove();
              state.zombies.splice(j, 1);
              state.enemiesAlive--;
              updateHUD();
            }
            break;
          }
        }
      }

      if (state.zombies.length === 0 && state.arrowsFlying.length === 0 && state.running) {
        if (state.phase >= 50) {
          endGame(true);
        } else {
          state.phase++;
          setTimeout(startPhase, 2000);
        }
      }

      requestAnimationFrame(loop);
    }

    function explode(x, y) {
      const boom = document.createElement('div');
      boom.className = 'explosion';
      boom.style.left = (x - 60) + 'px';
      boom.style.top = (y - 60) + 'px';
      arena.appendChild(boom);
      setTimeout(() => boom.remove(), 600);
    }

    function showDamage(x, y, dmg) {
      const d = document.createElement('div');
      d.className = 'damage';
      d.textContent = '-' + dmg;
      d.style.left = x + 'px';
      d.style.top = y + 'px';
      arena.appendChild(d);
      setTimeout(() => d.remove(), 1000);
    }

    function endGame(victory) {
      state.running = false;
      stopZombieGroans();
      AudioSys.stopMusic();
      $('go-title').textContent = victory ? '🏆 Vitória!' : '💀 Derrota';
      $('go-text').textContent = victory 
        ? 'Você derrotou o Cavaleiro Zumbi!' 
        : `Você chegou até a fase ${state.phase}.`;
      $('gameover-screen').classList.remove('hidden');
    }

    function startGame() {
      AudioSys.init();
      state.phase = 1;
      state.running = true;
      $('start-screen').classList.add('hidden');
      $('gameover-screen').classList.add('hidden');
      AudioSys.playSuspenseMusic();
      setTimeout(() => {
        const inst = $('instructions');
        if (inst) inst.style.opacity = '0';
      }, 3000);
      startPhase();
      requestAnimationFrame(loop);
    }

    $('btn-start').addEventListener('click', () => {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(()=>{});
      }
      startGame();
    });

    $('btn-retry').addEventListener('click', () => {
      state.zombies.forEach(z => z.el.remove());
      state.arrowsFlying.forEach(f => f.el.remove());
      state.zombies = [];
      state.arrowsFlying = [];
      startGame();
    });
  </script>
</body>
</html>
